# Render Blueprint for the public iPhone API. Secret values are entered in the
# Render dashboard during setup and never stored in this repository.
services:
  - type: web
    name: pcso-mobile-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GITHUB_REFRESH_TOKEN
        sync: false
      - key: REFRESH_REQUEST_KEY
        sync: false
      - key: GITHUB_REPOSITORY
        value: jonas230ph/Loteryanalysis
      - key: GITHUB_REFRESH_WORKFLOW
        value: refresh-lottery-data.yml
      - key: GITHUB_REFRESH_REF
        value: main
