name: FlightAware API Tests

on:
  push:
    paths:
      - "Flightdelay/api/**"
      - ".github/workflows/flightaware-api-tests.yml"
  pull_request:
    paths:
      - "Flightdelay/api/**"
      - ".github/workflows/flightaware-api-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Flightdelay/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
