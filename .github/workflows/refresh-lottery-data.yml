name: Refresh PCSO Lottery Data

on:
  # 22:30 Asia/Manila, after the usual evening PCSO draw window.
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcso-lottery-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: python -m pip install --requirement my_scraper/requirements.txt

      - name: Scrape and analyze current PCSO data
        working-directory: my_scraper
        env:
          SYNCHRONIZE_CMD: "true"
        run: python scripts/auto_pipeline.py

      - name: Publish mobile snapshot to Supabase
        working-directory: my_scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/publish_mobile_snapshot.py
